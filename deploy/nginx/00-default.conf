# =============================================================================
#  兜底站点（default_server）：处理“没有匹配到任何 server_name”的请求
#
#  Nginx 选站点的规则：先拿请求里的域名（HTTP 看 Host 头，HTTPS 看 TLS 握手里的 SNI）
#  去匹配各个 server 的 server_name；一个都匹配不上，就交给这个端口上的 default_server。
#  Cloudflare 灰色云（直连）时 VPS 的 IP 是公开的，扫描器整天用 IP 或乱填的域名来访问，
#  这里统一把它们挡掉。没有这个文件时，Debian 自带的 default 站点（“Welcome to nginx!”）会接住这些请求。
#
#  它还统一提供证书验证路径：本机所有用 HTTP-01 验证的证书（acme.sh 的 webroot 模式），
#  验证文件都放在 /var/www/letsencrypt，不管是哪个域名的验证请求，在这里都能拿到。
#  ⚠ 本机其他域名的证书（没有单独 server 块的）也靠这里续期，不要随手停用这个文件。
#
#  启用：
#    sudo cp 00-default.conf /etc/nginx/sites-available/
#    sudo ln -s /etc/nginx/sites-available/00-default.conf /etc/nginx/sites-enabled/
#    sudo rm /etc/nginx/sites-enabled/default        # 停用 Debian 自带的默认站点（sites-available 里的原文件保留）
#    sudo nginx -t && sudo systemctl reload nginx
# =============================================================================

# ① HTTP（80 端口）
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;                  # "_" 不是特殊语法，只是一个不会匹配任何真实域名的占位名
    server_tokens off;              # 错误页和响应头里不暴露 Nginx 版本号

    # 证书验证：Let's Encrypt 访问 http://<任意域名>/.well-known/acme-challenge/<文件名>
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 444;                 # Nginx 特有的状态码：什么都不返回，直接断开连接
    }
}

# ② HTTPS（443 端口）
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;

    # 不认识的域名（包括直接用 IP 访问）在 TLS 握手阶段就拒绝。这样不需要证书，
    # 也不会把本站证书（以及证书里写的域名）暴露给扫描器。需要 Nginx ≥ 1.19.4。
    ssl_reject_handshake on;

    # TLS 版本是在 Nginx 按 SNI 选中具体站点之前协商的，用的是默认站点的设置，
    # 所以这里也要写一遍，其他站点里的 ssl_protocols 才能真正生效。
    ssl_protocols TLSv1.2 TLSv1.3;
}
