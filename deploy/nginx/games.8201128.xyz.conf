# =============================================================================
#  games.8201128.xyz —— SEMIBLUFF 游戏星图（纯静态站点）
#
#  启用方法（Debian / Ubuntu 用 apt 安装的 Nginx）：
#    sudo cp games.8201128.xyz.conf /etc/nginx/sites-available/
#    sudo ln -s /etc/nginx/sites-available/games.8201128.xyz.conf /etc/nginx/sites-enabled/
#    sudo nginx -t && sudo systemctl reload nginx
#  其他发行版或 nginx.org 官方源：直接放进 /etc/nginx/conf.d/（文件名必须以 .conf 结尾）。
#
#  这个文件会被 nginx.conf 的 http { } 块包含进去，所以下面的 map 可以直接写在顶层。
#  完整的部署步骤见仓库里的 DEPLOY.md。
# =============================================================================

# 按路径决定浏览器 / Cloudflare 的缓存时间（从上到下匹配，第一条命中的生效）
map $uri $gamespace_cache_control {
    default                         "no-cache";                             # index.html 等：每次都向服务器确认，发布新版本后立刻生效
    ~^/assets/                      "public, max-age=31536000, immutable";  # Vite 构建的 JS / CSS / 字体：文件名带哈希，内容变了文件名就变，可以永久缓存
    ~*\.(?:webp|jpe?g|png|svg)$     "public, max-age=86400";                # 截图、分享图、图标：缓存 1 天
}

# ① HTTP（80 端口）：全部 301 跳转到 HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name games.8201128.xyz;

    # 给 Let's Encrypt 证书验证留的路径（用 Cloudflare 源站证书时用不到，留着无害）
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ② HTTPS（443 端口）：主站
server {
    listen 443 ssl http2;           # Nginx ≥ 1.25.1 推荐写成 "listen 443 ssl;" 再加一行 "http2 on;"
    listen [::]:443 ssl http2;
    server_name games.8201128.xyz;
    server_tokens off;              # 错误页和响应头里不暴露 Nginx 版本号

    # 证书：Cloudflare Origin CA 源站证书（DEPLOY.md 第 3 步生成并上传）
    ssl_certificate     /etc/ssl/cloudflare/games.8201128.xyz.pem;
    ssl_certificate_key /etc/ssl/cloudflare/games.8201128.xyz.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # 网站文件：current 是指向 releases/<发布时间> 的软链接，发布脚本切换它来上线新版本
    root  /var/www/gamespace/current;
    index index.html;

    access_log /var/log/nginx/gamespace.access.log;
    error_log  /var/log/nginx/gamespace.error.log warn;

    # 压缩文本资源（text/html 只要 gzip on 就会压缩，不用写进 gzip_types）
    gzip            on;
    gzip_vary       on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types      text/css text/plain application/javascript application/json image/svg+xml;

    # ---- 响应头 ----
    # add_header 的继承陷阱：子级 location 里只要写了任何一条 add_header，就不再继承这里的全部 add_header。
    # 所以本配置把响应头全部写在 server 级，下面的 location 里一条都不写（缓存时间由上面的 map 按路径算好）。
    add_header Cache-Control          $gamespace_cache_control always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy     "camera=(), microphone=(), geolocation=(), payment=()" always;
    # 内容安全策略（CSP）：只允许加载本站资源；connect-src 放行 api.github.com（档案读取 GitHub 最新 Release 版本号）。
    # 以后若在 Cloudflare 开启会注入脚本的功能（如 Web Analytics），需要把对应域名加进 script-src / connect-src。
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://api.github.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    # 确认 HTTPS 一切正常后，可以取消下一行注释开启 HSTS（浏览器会记住“这个域名只走 HTTPS”）
    # add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        # 站点只有一个页面（作品用 #poker 这样的锚点切换），不存在的路径直接返回 404
        try_files $uri $uri/ =404;
    }

    # 禁止访问隐藏文件（.git、.env 之类），保留 .well-known
    location ~ /\.(?!well-known) {
        deny all;
    }
}
