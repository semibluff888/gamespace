<!doctype html>
<html lang="zh-CN" data-mode="boot">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#03050b" />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <!--PORTAL:HEAD-->
    <noscript>
      <style>
        .boot, .hud, .scene, .labels, .reticle, .dossier, .terminal { display: none !important; }
        .list-view { display: block !important; }
      </style>
    </noscript>
  </head>
  <body>
    <canvas id="scene" class="scene" aria-hidden="true"></canvas>

    <div class="fx-layer" aria-hidden="true">
      <div class="fx-scanlines"></div>
      <div class="fx-frame"><i></i><i></i><i></i><i></i></div>
    </div>

    <div id="labels" class="labels" role="group" aria-label="星图中的信号"></div>

    <div id="reticle" class="reticle" aria-hidden="true">
      <svg class="reticle__ring" viewBox="0 0 100 100">
        <circle class="reticle__dash" cx="50" cy="50" r="48" />
        <circle class="reticle__track" cx="50" cy="50" r="44" />
        <circle class="reticle__progress" cx="50" cy="50" r="44" pathLength="100" />
      </svg>
      <i class="reticle__c reticle__c--tl"></i><i class="reticle__c reticle__c--tr"></i>
      <i class="reticle__c reticle__c--bl"></i><i class="reticle__c reticle__c--br"></i>
      <span class="reticle__text"></span>
    </div>

    <header class="hud hud--top">
      <div class="hud-brand">
        <span class="hud-brand__name" data-site="brand">SEMIBLUFF</span>
        <span class="hud-brand__sub"><span data-site="station">DEEP SPACE ARRAY</span><span class="hud-sep">//</span><span data-site="subtitle">游戏星图</span></span>
        <span class="hud-status map-only"><i class="hud-status__dot"></i><span data-status-text>LINK STABLE</span></span>
      </div>
      <div class="hud-controls">
        <div class="hud-progress map-only" data-hud-progress>
          <span class="hud-progress__label">DECODED</span>
          <span class="hud-progress__value"><b data-decoded>0</b><span>/</span><span data-total>4</span></span>
          <span class="hud-progress__bar" data-progress-bar></span>
        </div>
        <div class="hud-filter map-only" data-filter>
          <button class="hud-btn" type="button" data-action="filter" aria-expanded="false" aria-controls="filter-panel" aria-label="星图配色" title="配色 (C)">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.6" /><circle cx="12" cy="7.9" r="2.1" /><circle cx="8.45" cy="14.05" r="2.1" /><circle cx="15.55" cy="14.05" r="2.1" /></svg>
          </button>
          <div class="filter-panel" id="filter-panel" hidden>
            <p class="filter-panel__head" id="filter-panel-title"><span>FILTER</span>星图配色</p>
            <div class="filter-panel__list" role="radiogroup" aria-labelledby="filter-panel-title" data-filter-list></div>
            <p class="filter-panel__foot only-pointer"><kbd>C</kbd>循环切换</p>
          </div>
        </div>
        <button class="hud-btn" type="button" data-action="sound" aria-pressed="false" aria-label="开启配乐与音效" title="配乐与音效 (M)">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path class="i-speaker" d="M4 9h3l5-4v14l-5-4H4z" /><path class="i-wave" d="M15.5 8.5a5 5 0 0 1 0 7M18 6a8.5 8.5 0 0 1 0 12" /><path class="i-mute" d="M16 9.5l5 5M21 9.5l-5 5" /></svg>
        </button>
        <button class="hud-btn" type="button" data-action="view" aria-label="切换到列表视图" title="列表 / 星图 (L)">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path class="i-list" d="M4 5h6v6H4zM14 5h6v6h-6zM4 13h6v6H4zM14 13h6v6h-6z" /><g class="i-map"><circle cx="12" cy="12" r="8" /><circle cx="12" cy="12" r="3" /><path d="M12 2v4M12 18v4M2 12h4M18 12h4" /></g></svg>
        </button>
        <a class="hud-btn" data-site-link="github" href="https://github.com/semibluff888" target="_blank" rel="noopener noreferrer" aria-label="GitHub" title="GitHub">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path class="i-fill" d="M12 2a10 10 0 0 0-3.16 19.49c.5.09.68-.22.68-.48v-1.7c-2.78.6-3.37-1.34-3.37-1.34-.45-1.16-1.11-1.47-1.11-1.47-.91-.62.07-.6.07-.6 1 .07 1.53 1.03 1.53 1.03.9 1.52 2.34 1.08 2.91.83.09-.65.35-1.08.63-1.33-2.22-.25-4.56-1.11-4.56-4.94 0-1.09.39-1.98 1.03-2.68-.1-.25-.45-1.27.1-2.65 0 0 .84-.27 2.75 1.02a9.56 9.56 0 0 1 5 0c1.91-1.29 2.75-1.02 2.75-1.02.55 1.38.2 2.4.1 2.65.64.7 1.03 1.59 1.03 2.68 0 3.84-2.34 4.69-4.57 4.93.36.31.68.92.68 1.85v2.75c0 .27.18.58.69.48A10 10 0 0 0 12 2z" /></svg>
        </a>
      </div>
    </header>

    <div class="hud hud--bottom map-only">
      <div class="hud-radar">
        <canvas id="radar" class="hud-radar__canvas" width="160" height="160" role="img" aria-label="雷达：显示所有信号的方位，点击光点可飞往该信号"></canvas>
        <div class="hud-readout" aria-hidden="true">
          <span>AZ <b data-ro="az">000.0</b>°</span><span>EL <b data-ro="el">00.0</b>°</span><span>DST <b data-ro="dst">000</b></span>
        </div>
      </div>
      <div class="hud-hints" data-hints>
        <span class="only-pointer"><kbd>拖拽</kbd>环视</span>
        <span class="only-pointer"><kbd>滚轮</kbd>缩放</span>
        <span class="only-pointer"><kbd>悬停</kbd>扫描</span>
        <span class="only-pointer"><kbd>点击</kbd>锁定</span>
        <span class="only-pointer"><kbd>~</kbd>控制台</span>
        <span class="only-touch"><kbd>拖动</kbd>环视</span>
        <span class="only-touch"><kbd>双指</kbd>缩放</span>
        <span class="only-touch"><kbd>轻点</kbd>锁定</span>
      </div>
    </div>

    <aside id="dossier" class="dossier" aria-hidden="true" aria-labelledby="dossier-title"></aside>

    <main id="list-view" class="list-view" aria-label="游戏列表"><!--PORTAL:LIST--></main>

    <section id="terminal" class="terminal" hidden aria-label="控制台">
      <div class="terminal__head"><span>OPERATOR CONSOLE</span><span>ESC / ~ 关闭</span></div>
      <div class="terminal__log" role="log" aria-live="polite"></div>
      <form class="terminal__form" autocomplete="off">
        <label for="terminal-input" class="terminal__prompt">observer@array:~$</label>
        <input id="terminal-input" class="terminal__input" type="text" spellcheck="false" autocapitalize="off" autocomplete="off" />
      </form>
    </section>

    <div id="toasts" class="toasts" role="status" aria-live="polite"></div>

    <div id="boot" class="boot">
      <div class="boot__inner">
        <pre class="boot__log" data-boot-log></pre>
        <div class="boot__bar"><i data-boot-bar></i></div>
        <div class="boot__meta"><span data-boot-pct>000%</span><span class="boot__skip">按任意键跳过</span></div>
      </div>
    </div>

    <div id="warp-flash" class="warp-flash" aria-hidden="true"></div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
